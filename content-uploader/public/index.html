<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qadamcha - Video Yuklash</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input {
            width: auto;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .content-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .content-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--bg);
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border);
        }

        .content-info h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .content-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            background: var(--primary);
        }

        .badge.cartoon {
            background: #3b82f6;
        }

        .badge.game {
            background: #10b981;
        }

        .badge.story {
            background: #f59e0b;
        }

        .badge.quest {
            background: #8b5cf6;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            color: white;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat {
            flex: 1;
            padding: 1rem;
            background: var(--bg);
            border-radius: 0.5rem;
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎬 Qadamcha Content Uploader</h1>
        <p class="subtitle">Video kontentlarni bazaga yuklash uchun admin panel</p>

        <div class="grid">
            <!-- Form -->
            <div class="card">
                <h2>➕ Yangi Video Qo'shish</h2>
                <form id="uploadForm">
                    <div class="form-group">
                        <label>Video Nomi *</label>
                        <input type="text" name="title" required placeholder="Masalan: Alpomish ertagi">
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Turi *</label>
                            <select name="type" required>
                                <option value="">Tanlang...</option>
                                <option value="cartoon">🎬 Multfilm</option>
                                <option value="game">🎮 O'yin</option>
                                <option value="story">📖 Hikoya</option>
                                <option value="quest">🧩 Topshiriq</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Kategoriya</label>
                            <input type="text" name="category" placeholder="Masalan: Ta'lim, Ertak">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Til</label>
                        <select name="language">
                            <option value="uz">🇺🇿 O'zbek tili</option>
                            <option value="ru">🇷🇺 Rus tili</option>
                            <option value="en">🇬🇧 Ingliz tili</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tavsif</label>
                        <textarea name="description" placeholder="Video haqida qisqacha..."></textarea>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Yosh (min)</label>
                            <input type="number" name="ageMin" min="1" max="18" value="3">
                        </div>
                        <div class="form-group">
                            <label>Yosh (max)</label>
                            <input type="number" name="ageMax" min="1" max="18" value="12">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Bunny.net Video ID</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" name="videoId" id="videoIdInput"
                                placeholder="Masalan: 9acac5a0-4742-4f6e-..." style="flex: 1;">
                            <button type="button" class="btn"
                                style="background: var(--success); color: white; padding: 0.75rem 1rem;"
                                onclick="fetchVideoInfo()">🔍 Olish</button>
                        </div>
                        <small id="videoStatus" style="color: var(--text-muted); font-size: 0.75rem;"></small>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Davomiyligi (sekund)</label>
                            <input type="number" name="duration" min="0" placeholder="300">
                        </div>
                        <div class="form-group">
                            <label>Thumbnail URL</label>
                            <input type="url" name="thumbnail" placeholder="https://...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Teglar (vergul bilan)</label>
                        <input type="text" name="tags" placeholder="ta'lim, matematika, bolalar">
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" name="isFeatured" id="isFeatured">
                        <label for="isFeatured" style="margin: 0;">⭐ Tavsiya etilganlarda ko'rsatish</label>
                    </div>

                    <button type="submit" class="btn btn-primary">💾 Saqlash</button>
                </form>
            </div>

            <!-- List -->
            <div class="card">
                <h2>📋 Mavjud Kontentlar</h2>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">Jami</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="cartoonCount">0</div>
                        <div class="stat-label">Multfilm</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="gameCount">0</div>
                        <div class="stat-label">O'yin</div>
                    </div>
                </div>
                <div class="content-list" id="contentList">
                    <div class="empty">Yuklanmoqda...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const contentList = document.getElementById('contentList');

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Kontentlarni yuklash
        async function loadContents() {
            try {
                const res = await fetch('/api/contents');
                const data = await res.json();

                if (data.success) {
                    document.getElementById('totalCount').textContent = data.count;
                    document.getElementById('cartoonCount').textContent = data.contents.filter(c => c.type === 'cartoon').length;
                    document.getElementById('gameCount').textContent = data.contents.filter(c => c.type === 'game').length;

                    if (data.contents.length === 0) {
                        contentList.innerHTML = '<div class="empty">Hali kontent yo\'q. Yuqoridagi formadan qo\'shing!</div>';
                        return;
                    }

                    contentList.innerHTML = data.contents.map(c => `
                        <div class="content-item">
                            <div class="content-info">
                                <h3>${c.title}</h3>
                                <div class="content-meta">
                                    <span class="badge ${c.type}">${c.type}</span>
                                    <span>📂 ${c.category || 'Kategoriyasiz'}</span>
                                    <span>🌐 ${c.language === 'uz' ? "O'zbek" : c.language === 'ru' ? 'Rus' : 'Ingliz'}</span>
                                    <span>👶 ${c.ageRange?.min || 3}-${c.ageRange?.max || 12} yosh</span>
                                    <span>⏱ ${c.duration ? Math.floor(c.duration / 60) + ' daq' : '-'}</span>
                                </div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteContent('${c._id}')">🗑️</button>
                        </div>
                    `).join('');
                }
            } catch (error) {
                contentList.innerHTML = '<div class="empty">Xato: ' + error.message + '</div>';
            }
        }

        // Yangi kontent qo'shish
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            data.isFeatured = form.isFeatured.checked;

            try {
                const res = await fetch('/api/contents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (result.success) {
                    showToast('✅ Kontent qo\'shildi!');
                    form.reset();
                    loadContents();
                } else {
                    showToast('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showToast('❌ Xato: ' + error.message, 'error');
            }
        });

        // Kontentni o'chirish
        async function deleteContent(id) {
            if (!confirm('Rostdan o\'chirmoqchimisiz?')) return;

            try {
                const res = await fetch(`/api/contents/${id}`, { method: 'DELETE' });
                const result = await res.json();

                if (result.success) {
                    showToast('🗑️ O\'chirildi!');
                    loadContents();
                }
            } catch (error) {
                showToast('❌ Xato: ' + error.message, 'error');
            }
        }

        // Sahifa yuklanganda
        loadContents();

        // Bunny.net dan video ma'lumotlarini olish
        async function fetchVideoInfo() {
            const videoId = document.getElementById('videoIdInput').value.trim();
            const statusEl = document.getElementById('videoStatus');

            if (!videoId) {
                showToast('❌ Video ID kiriting!', 'error');
                return;
            }

            statusEl.textContent = '⏳ Yuklanmoqda...';
            statusEl.style.color = 'var(--text-muted)';

            try {
                const res = await fetch(`/api/bunny/${videoId}`);
                const data = await res.json();

                if (data.success) {
                    // Maydonlarni to'ldirish
                    document.querySelector('input[name="duration"]').value = data.video.duration || '';
                    document.querySelector('input[name="thumbnail"]').value = data.video.thumbnail || '';

                    // Agar title bo'sh bo'lsa, Bunny'dagi nomini qo'yish
                    const titleInput = document.querySelector('input[name="title"]');
                    if (!titleInput.value && data.video.title) {
                        titleInput.value = data.video.title;
                    }

                    statusEl.textContent = `✅ Topildi! Davomiyligi: ${Math.floor(data.video.duration / 60)} daqiqa ${data.video.duration % 60} sekund`;
                    statusEl.style.color = 'var(--success)';
                    showToast('✅ Video ma\'lumotlari olindi!');
                } else {
                    statusEl.textContent = '❌ ' + data.message;
                    statusEl.style.color = 'var(--danger)';
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (error) {
                statusEl.textContent = '❌ Xato: ' + error.message;
                statusEl.style.color = 'var(--danger)';
                showToast('❌ Xato: ' + error.message, 'error');
            }
        }
    </script>
</body>

</html>
