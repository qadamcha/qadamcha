name: qadamcha_app
description: "Qadamcha - Ota-ona va bola uchun vaqt boshqaruv ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0
  
  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  
  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI/UX
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  
  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.5
  
  # QR Code (qurilma ulash uchun)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  
  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  flutter_native_splash: ^2.4.3
  
  # Icons
  cupertino_icons: ^1.0.8
  
  # Firebase (Push Notifications)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.2.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  

