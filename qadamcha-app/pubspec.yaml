name: qadamcha_app
description: "Qadamcha - Ota-ona va bola uchun vaqt boshqaruv ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.8 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: 8.1.6
  equatable: 2.0.8
  dartz: 0.10.1

  # Dependency Injection
  get_it: 8.3.0

  # Network
  dio: 5.9.1
  http: ^1.2.0
  retrofit: 4.9.2
  json_annotation: 4.9.0

  # Local Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: 9.2.4

  # UI/UX
  flutter_screenutil: 5.9.3
  google_fonts: 6.3.3
  flutter_svg: 2.2.3
  cached_network_image: 3.4.1
  shimmer: 3.0.0
  lottie: 3.3.2
  flutter_markdown: ^0.7.6
  smart_auth: ^2.0.0

  # Video Player
  video_player: 2.10.1
  chewie: 1.13.0

  # QR Code (qurilma ulash uchun)
  qr_flutter: 4.1.0
  mobile_scanner: 5.2.3

  # Share
  share_plus: ^10.0.0

  # Payment WebView
  webview_flutter: ^4.10.0

  # Utilities
  intl: 0.19.0
  connectivity_plus: 6.1.5
  package_info_plus: 8.3.1
  device_info_plus: 11.5.0
  flutter_native_splash: 2.4.7

  # Icons
  cupertino_icons: 1.0.8

  # Firebase (Push Notifications)
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  flutter_local_notifications: 18.0.1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.3.3
  path_provider: ^2.1.5
  audioplayers: ^6.6.0
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  bloc_test: 9.1.7
  mocktail: 1.0.4
  build_runner: 2.4.13
  json_serializable: 6.8.0
  retrofit_generator: 8.2.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/guides/
    - assets/icon/
    - assets/icons/
    - assets/animations/
    - assets/bubble_world/
    - assets/coloring_pages/
    - assets/sounds/
  
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"
